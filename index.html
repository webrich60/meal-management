    const FileText = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>);
    const Edit = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>);
    const X = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
    const Coffee = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>);

    const PFCDonutChart = ({ protein, fat, carbs }) => {
      const pCal = protein * 4;
      const fCal = fat * 9;
      const cCal = carbs * 4;
      const total = pCal + fCal + cCal || 1; 

      const pPct = (pCal / total) * 100;
      const fPct = (fCal / total) * 100;
      const cPct = (cCal / total) * 100;

      return (
        <div className="flex flex-col items-center justify-center">
          <div className="relative w-32 h-32 mb-4">
            <svg viewBox="0 0 40 40" className="w-full h-full -rotate-90 drop-shadow-md">
              <circle r="15.915" cx="20" cy="20" fill="transparent" stroke="#f3f4f6" strokeWidth="6" />
              {pPct > 0 && <circle r="15.915" cx="20" cy="20" fill="transparent" stroke="#3b82f6" strokeWidth="6" strokeDasharray={`${pPct} ${100 - pPct}`} strokeDashoffset="0" className="transition-all duration-1000 ease-out" />}
              {fPct > 0 && <circle r="15.915" cx="20" cy="20" fill="transparent" stroke="#ef4444" strokeWidth="6" strokeDasharray={`${fPct} ${100 - fPct}`} strokeDashoffset={`-${pPct}`} className="transition-all duration-1000 ease-out" />}
              {cPct > 0 && <circle r="15.915" cx="20" cy="20" fill="transparent" stroke="#f59e0b" strokeWidth="6" strokeDasharray={`${cPct} ${100 - cPct}`} strokeDashoffset={`-${pPct + fPct}`} className="transition-all duration-1000 ease-out" />}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span className="text-xs text-gray-500 font-medium">PFC</span>
              <span className="text-sm font-bold text-gray-700">バランス</span>
            </div>
          </div>
          <div className="flex justify-center space-x-4 text-sm font-medium">
            <div className="flex items-center"><span className="w-3 h-3 rounded-full bg-blue-500 mr-1"></span>P: {protein}g</div>
            <div className="flex items-center"><span className="w-3 h-3 rounded-full bg-red-500 mr-1"></span>F: {fat}g</div>
            <div className="flex items-center"><span className="w-3 h-3 rounded-full bg-yellow-500 mr-1"></span>C: {carbs}g</div>
          </div>
        </div>
      );
    };

    const EditModal = ({ item, onSave, onClose, gasUrl }) => {
      const [formData, setFormData] = useState({
        mealName: item.mealName ? item.mealName.replace(/^\[.*?\]\s*/, '') : "",
        calories: item.calories || 0,
        protein: item.protein || 0,
        fat: item.fat || 0,
        carbs: item.carbs || 0,
        salt: item.salt || 0,
        weight: item.weight || ""
      });
      const [isSaving, setIsSaving] = useState(false);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: name === 'mealName' ? value : (value === '' ? '' : Number(value))
        }));
      };

      const handleSave = async () => {
        setIsSaving(true);
        try {
          const response = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: "update",
              targetDate: item.date,
              recordData: formData
            })
          });
          const data = await response.json();
          if (data.status === "error") throw new Error(data.message);
          
          onSave(formData);
        } catch (err) {
          alert("保存に失敗しました: " + err.message);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm max-h-[90vh] flex flex-col shadow-2xl animate-fade-in">
            <div className="p-4 border-b flex justify-between items-center bg-emerald-600 text-white rounded-t-2xl">
              <h3 className="font-bold flex items-center"><Edit size={18} className="mr-2"/>記録の編集</h3>
              <button onClick={onClose} className="p-1 hover:bg-emerald-700 rounded-full"><X size={20}/></button>
            </div>
            
            <div className="p-5 overflow-y-auto space-y-4">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">食事名 (内容)</label>
                <input type="text" name="mealName" value={formData.mealName} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">カロリー (kcal)</label>
                  <input type="number" name="calories" value={formData.calories} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">塩分 (g)</label>
                  <input type="number" step="0.1" name="salt" value={formData.salt} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
                </div>
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">タンパク質 (g)</label>
                  <input type="number" step="0.1" name="protein" value={formData.protein} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">脂質 (g)</label>
                  <input type="number" step="0.1" name="fat" value={formData.fat} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">炭水化物 (g)</label>
                  <input type="number" step="0.1" name="carbs" value={formData.carbs} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
                </div>
              </div>
              <div className="pt-2">
                <label className="block text-xs font-bold text-gray-600 mb-1">体重 (kg)</label>
                <input type="number" step="0.1" name="weight" value={formData.weight} onChange={handleChange} className="w-full border rounded-lg p-2 text-sm focus:border-emerald-500 outline-none" />
              </div>
            </div>

            <div className="p-4 border-t bg-gray-50 rounded-b-2xl flex space-x-3">
              <button onClick={onClose} className="flex-1 bg-white border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-100">キャンセル</button>
              <button onClick={handleSave} disabled={isSaving} className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-700 flex items-center justify-center">
                {isSaving ? <RefreshCw size={18} className="animate-spin" /> : "上書き保存"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [gasUrl, setGasUrl] = useState("");
      const [showSettings, setShowSettings] = useState(false);
      const [tempUrl, setTempUrl] = useState("");
      
      const [nickname, setNickname] = useState("たけじい");
      const [age, setAge] = useState("61");
      const [gender, setGender] = useState("男性");
      const [height, setHeight] = useState("");
      const [weight, setWeight] = useState("");
      const [medicalConditions, setMedicalConditions] = useState("高血圧(塩分1日6.0g未満 目安)、腰痛(脊柱管狭窄症, ヘルニア術後)、眼の病気(角膜移植ご経験)");

      const [selectedDate, setSelectedDate] = useState(() => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      });

      const [mealType, setMealType] = useState('朝ご飯'); 
      const [imagePreview, setImagePreview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      
      const [showHistory, setShowHistory] = useState(false);
      const [historyData, setHistoryData] = useState([]);
      const [historyLoading, setHistoryLoading] = useState(false);
      const [visibleCount, setVisibleCount] = useState(10); 
      
      const [showTextInput, setShowTextInput] = useState(false);
      const [textInputData, setTextInputData] = useState("");
      const [editingItem, setEditingItem] = useState(null);

      const cameraInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      useEffect(() => {
        const savedUrl = localStorage.getItem('gasUrl');
        if (savedUrl) { setGasUrl(savedUrl); setTempUrl(savedUrl); } 
        else { setShowSettings(true); }
        
        const savedNickname = localStorage.getItem('userNickname');
        const savedAge = localStorage.getItem('userAge');
        const savedGender = localStorage.getItem('userGender');
        const savedHeight = localStorage.getItem('userHeight');
        const savedWeight = localStorage.getItem('userWeight');
        const savedMedical = localStorage.getItem('userMedical');

        if (savedNickname) setNickname(savedNickname);
        if (savedAge) setAge(savedAge);
        if (savedGender) setGender(savedGender);
        if (savedHeight) setHeight(savedHeight);
        if (savedWeight) setWeight(savedWeight);
        if (savedMedical) setMedicalConditions(savedMedical);
      }, []);

      const createImageFingerprint = (sourceCanvas) => {
        const size = 8;
        const tinyCanvas = document.createElement('canvas');
        tinyCanvas.width = size;
        tinyCanvas.height = size;
        const tinyCtx = tinyCanvas.getContext('2d', { willReadFrequently: true });
        if (!tinyCtx) return "";

        tinyCtx.drawImage(sourceCanvas, 0, 0, size, size);
        const pixels = tinyCtx.getImageData(0, 0, size, size).data;
        const grayValues = [];
        let total = 0;

        for (let i = 0; i < pixels.length; i += 4) {
          const gray = Math.round((pixels[i] * 0.299) + (pixels[i + 1] * 0.587) + (pixels[i + 2] * 0.114));
          grayValues.push(gray);
          total += gray;
        }

        const average = total / grayValues.length;
        let bits = "";
        grayValues.forEach(value => { bits += value >= average ? "1" : "0"; });

        let hex = "";
        for (let i = 0; i < bits.length; i += 4) {
          hex += parseInt(bits.slice(i, i + 4), 2).toString(16);
        }
        return hex;
      };

      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          if (!file) {
            reject(new Error("画像が選択されていません。"));
            return;
          }
          if (file.size > 30 * 1024 * 1024) {
            reject(new Error("画像が大きすぎます。30MB以下の画像を選択してください。"));
            return;
          }

          const objectUrl = URL.createObjectURL(file);
          const img = new Image();
          let finished = false;

          const cleanup = () => {
            if (!finished) {
              finished = true;
              URL.revokeObjectURL(objectUrl);
            }
          };

          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let width = img.naturalWidth || img.width;
              let height = img.naturalHeight || img.height;
              const MAX_SIDE = 900;

              if (!width || !height) {
                throw new Error("画像の大きさを読み取れませんでした。");
              }

              const scale = Math.min(1, MAX_SIDE / Math.max(width, height));
              width = Math.max(1, Math.round(width * scale));
              height = Math.max(1, Math.round(height * scale));
              canvas.width = width;
              canvas.height = height;

              const ctx = canvas.getContext('2d', { alpha: false });
              if (!ctx) throw new Error("画像処理を開始できませんでした。");
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);

              const dataUrl = canvas.toDataURL('image/jpeg', 0.74);
              if (!dataUrl || dataUrl === 'data:,') {
                throw new Error("画像の圧縮に失敗しました。");
              }
              const fingerprint = createImageFingerprint(canvas);
              cleanup();
              resolve({ dataUrl, fingerprint });
            } catch (error) {
              cleanup();
              reject(error);
            }
          };

          img.onerror = () => {
            cleanup();
            const type = (file.type || '').toLowerCase();
            if (type.includes('heic') || type.includes('heif')) {
              reject(new Error("HEIC画像をこのブラウザで読み込めません。カメラ設定をJPEGにするか、スクリーンショットを選択してください。"));
            } else {
              reject(new Error("画像ファイルを読み込めませんでした。別の画像でお試しください。"));
            }
          };

          img.src = objectUrl;
        });
      };

      const handleImageUpload = async (e) => {
        const input = e.currentTarget;
        const file = input.files && input.files[0];

        if (!file || !file.type.startsWith('image/')) {
          setError("画像を選択してください。");
          input.value = "";
          return;
        }
        if (!gasUrl) {
          setShowSettings(true);
          alert("GASのURLを設定してください！");
          input.value = "";
          return;
        }
        if (weight) localStorage.setItem('userWeight', weight);

        setError("");
        setResult(null);
        setLoading(true);
        setShowTextInput(false);

        try {
          const compressedImage = await compressImage(file);
          const compressedDataUrl = compressedImage.dataUrl;
          setImagePreview(compressedDataUrl);
          await processRequest({
            image: compressedDataUrl.substring(compressedDataUrl.indexOf(',') + 1),
            mimeType: 'image/jpeg',
            imageFingerprint: compressedImage.fingerprint
          });
        } catch (err) {
          setError("【画像読み込みエラー】\n" + (err?.message || "画像の読み込みに失敗しました。"));
          setImagePreview(null);
          setLoading(false);
        } finally {
          // 同じ画像をもう一度選び直せるようにリセット
          input.value = "";
        }
      };

      const handleTextSubmit = async () => {
        if (!textInputData.trim()) { alert("食事の内容を入力してください"); return; }
        if (!gasUrl) { setShowSettings(true); alert("GASのURLを設定してください！"); return; }
        if (weight) localStorage.setItem('userWeight', weight);

        setError(""); setResult(null); setLoading(true); setImagePreview(null);
        await processRequest({ textInput: textInputData });
      };

      const handleSkipMeal = async () => {
        if (!gasUrl) { setShowSettings(true); alert("設定してください"); return; }
        if (!window.confirm(`${selectedDate} の ${mealType} を「食事なし」として記録しますか？`)) return;
        if (weight) localStorage.setItem('userWeight', weight);

        setError(""); setResult(null); setLoading(true); setImagePreview(null); setShowTextInput(false);
        await processRequest({ skipMeal: true });
      };

      const handleRecordWeightOnly = async () => {
        if (!gasUrl) { setShowSettings(true); alert("設定してください"); return; }
        if (!weight) { alert("体重を入力してください！"); return; }
        localStorage.setItem('userWeight', weight);

        setError(""); setResult(null); setLoading(true); setImagePreview(null); setShowTextInput(false);
        await processRequest({ recordWeightOnly: true });
      };

      const processRequest = async (specificPayload) => {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 150000);

        const sendRequest = async (forceDuplicate = false) => {
          const payload = {
            action: "record",
            mealType, date: selectedDate,
            nickname, age, gender, height, weight, medicalConditions,
            ...specificPayload,
            forceDuplicate
          };

          const response = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            signal: controller.signal,
            cache: 'no-store'
          });

          const responseText = await response.text();
          if (!response.ok) {
            throw new Error("HTTPステータスエラー: " + response.status);
          }

          try {
            return JSON.parse(responseText);
          } catch (parseError) {
            throw new Error("GASからJSON以外の応答が返りました。新しいデプロイが反映されているか確認してください。");
          }
        };

        try {
          let data = await sendRequest(false);

          if (data.status === "duplicate") {
            const shouldRegister = window.confirm(
              data.message || "同じ内容が既に登録されています。重複して登録しますか？"
            );

            if (!shouldRegister) {
              if (specificPayload.image) setImagePreview(null);
              return;
            }

            data = await sendRequest(true);
          }

          if (data.status === "error") {
            throw new Error("【GAS内部エラー】\n" + (data.message || "原因不明のエラー"));
          }
          if (!data.data) {
            throw new Error("解析結果が返りませんでした。");
          }

          setResult(data.data);
          setTextInputData("");
        } catch (err) {
          const message = err?.name === 'AbortError'
            ? "解析に時間がかかりすぎたため中断しました。通信状態を確認して、もう一度お試しください。"
            : (err?.message || "通信エラーが発生しました。");
          setError("【詳細なエラー原因】\n" + message);
        } finally {
          clearTimeout(timeoutId);
          setLoading(false);
        }
      };

      const resetApp = () => {
        setImagePreview(null); setResult(null); setError(""); setShowTextInput(false);
        if (cameraInputRef.current) cameraInputRef.current.value = "";
        if (galleryInputRef.current) galleryInputRef.current.value = "";
      };

      const handleSaveSettings = () => {
        const trimmedUrl = tempUrl.trim();
        if (!trimmedUrl) { alert("URLを入力してください！"); return; }
        if (!trimmedUrl.endsWith('/exec')) { alert("⚠️ URLの最後が「/exec」で終わっていません！"); return; }
        
        localStorage.setItem('gasUrl', trimmedUrl);
        localStorage.setItem('userNickname', nickname);
        localStorage.setItem('userAge', age);
        localStorage.setItem('userGender', gender);
        localStorage.setItem('userHeight', height);
        localStorage.setItem('userMedical', medicalConditions);
        
        setGasUrl(trimmedUrl);
        alert("✅ 設定を保存しました！");
        setShowSettings(false);
      };

      const loadHistory = async () => {
        if (!gasUrl) { setShowSettings(true); alert("設定を完了してください"); return; }
        setShowHistory(true); setHistoryLoading(true); setVisibleCount(10); 
        try {
          const response = await fetch(gasUrl); 
          if (!response.ok) throw new Error("HTTPエラー: " + response.status);
          const data = await response.json();
          if (data.status === "error") throw new Error("GASエラー: " + data.message);
          setHistoryData(data.data);
        } catch (err) { alert("【履歴取得エラー】\n" + err.message); } 
        finally { setHistoryLoading(false); }
      };

      const formatDate = (dateString) => {
        const d = new Date(dateString);
        return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
      };

      const handleEditSave = (newData) => {
        if (showHistory) {
          setHistoryData(prev => prev.map(item => {
            if (item.date === editingItem.date) {
               return { ...item, ...newData, mealName: `[${item.mealName.match(/^\[(.*?)\]/)?.[1] || "食事"}] ${newData.mealName}` };
            }
            return item;
          }));
        }
        if (result && result.date === editingItem.date) {
          setResult(prev => ({ ...prev, ...newData, mealName: newData.mealName }));
        }
        setEditingItem(null);
      };

      const displayedHistory = historyData.slice(0, visibleCount);

      const renderEditModal = () => {
        if (!editingItem) return null;
        return <EditModal item={editingItem} onSave={handleEditSave} onClose={() => setEditingItem(null)} gasUrl={gasUrl} />;
      };

      // === 設定画面 ===
      if (showSettings) {
        return (
          <div className="min-h-screen text-gray-800 font-sans sm:p-4 bg-emerald-50 flex items-center justify-center">
            {renderEditModal()}
            <div className="w-full max-w-md bg-white sm:rounded-2xl shadow-xl p-6 m-0 sm:m-4 max-h-screen overflow-y-auto">
              <h2 className="text-xl font-bold text-emerald-800 mb-6 flex items-center"><Settings className="mr-2"/>アプリ・プロフィール設定</h2>
              
              <div className="space-y-5 mb-8">
                <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 space-y-4">
                  <h3 className="font-bold text-emerald-700 flex items-center"><UserIcon size={18} className="mr-2"/>基本プロフィール</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-xs font-bold text-gray-600 mb-1">お名前 (呼び名)</label><input type="text" value={nickname} onChange={(e) => setNickname(e.target.value)} className="w-full border border-emerald-200 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500" /></div>
                    <div><label className="block text-xs font-bold text-gray-600 mb-1">年齢</label><input type="number" value={age} onChange={(e) => setAge(e.target.value)} className="w-full border border-emerald-200 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500" /></div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">性別</label>
                      <select value={gender} onChange={(e) => setGender(e.target.value)} className="w-full border border-emerald-200 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500 bg-white"><option value="男性">男性</option><option value="女性">女性</option><option value="その他">その他</option></select>
                    </div>
                    <div><label className="block text-xs font-bold text-gray-600 mb-1">身長 (cm)</label><input type="number" value={height} onChange={(e) => setHeight(e.target.value)} placeholder="例: 165" className="w-full border border-emerald-200 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500" /></div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">持病・気をつけていること (AIに伝えます)</label>
                    <textarea value={medicalConditions} onChange={(e) => setMedicalConditions(e.target.value)} placeholder="例: 高血圧、ダイエット中、など" className="w-full border border-emerald-200 rounded-lg p-3 text-sm h-24 focus:outline-none focus:border-emerald-500" />
                  </div>
                </div>
                <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                  <h3 className="font-bold text-gray-700 mb-3 flex items-center"><Settings size={18} className="mr-2"/>システム設定</h3>
                  <label className="block text-xs font-bold text-gray-600 mb-1">GAS Webアプリ URL</label>
                  <textarea className="w-full border border-gray-300 rounded-lg p-3 text-sm h-20 focus:outline-none focus:border-gray-500" value={tempUrl} onChange={(e) => setTempUrl(e.target.value)} placeholder="https://script.google.com/macros/s/......./exec" />
                </div>
              </div>
              <div className="flex space-x-3 sticky bottom-0 bg-white pt-2 pb-4">
                <button onClick={handleSaveSettings} className="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 shadow-sm flex items-center justify-center"><Save className="mr-2" size={20} />保存して戻る</button>
                {gasUrl && <button onClick={() => { setTempUrl(gasUrl); setShowSettings(false); }} className="px-4 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200">キャンセル</button>}
              </div>
            </div>
          </div>
        );
      }

      // === 履歴画面 ===
      if (showHistory) {
        return (
          <div className="min-h-screen text-gray-800 font-sans sm:p-4 bg-emerald-50">
            {renderEditModal()}
            <div className="max-w-md mx-auto bg-white sm:rounded-2xl sm:shadow-xl overflow-hidden min-h-screen sm:min-h-[auto] flex flex-col">
              <header className="bg-emerald-600 text-white p-4 shadow-md z-10 flex items-center">
                <button onClick={() => setShowHistory(false)} className="p-2 mr-2 bg-emerald-700 rounded-full hover:bg-emerald-800 active:scale-95"><ArrowLeft size={20}/></button>
                <h1 className="text-lg font-bold flex items-center"><HistoryIcon className="mr-2"/>記録の履歴</h1>
              </header>
              <main className="flex-grow p-4 overflow-y-auto bg-gray-50">
                {historyLoading ? (
                  <div className="flex flex-col items-center justify-center py-20 text-emerald-600">
                    <RefreshCw className="animate-spin mb-4" size={32} />
                    <p className="font-bold">履歴を読み込んでいます...</p>
                  </div>
                ) : historyData.length === 0 ? (
                  <p className="text-center text-gray-500 py-10">まだ記録がありません</p>
                ) : (
                  <div className="space-y-4 pb-6">
                    {displayedHistory.map((item, idx) => (
                      <div key={idx} className="bg-white rounded-xl p-4 shadow-sm border border-emerald-100 animate-fade-in relative">
                        {/* ★ 編集ボタン */}
                        <button onClick={() => setEditingItem(item)} className="absolute top-3 right-3 text-gray-400 hover:text-emerald-600 bg-gray-50 p-1.5 rounded-md border shadow-sm active:scale-95"><Edit size={16}/></button>
                        
                        <div className="flex items-start space-x-3 mb-2">
                          {item.imageUrl ? (
                            <img src={item.imageUrl} alt="食事" onError={(e) => { e.currentTarget.style.display = 'none'; }} className="w-16 h-16 object-cover rounded-lg flex-shrink-0 shadow-sm border" />
                          ) : (
                            <div className="w-16 h-16 bg-emerald-50 flex items-center justify-center rounded-lg flex-shrink-0 text-emerald-300 border border-emerald-100">
                              {item.mealName === "体重の記録" ? <ScaleIcon size={28} className="text-blue-400"/> : item.score === "-" ? <Coffee size={28}/> : <Utensils size={28}/>}
                            </div>
                          )}
                          <div className="flex-grow pr-8">
                            <p className="text-xs text-gray-500 mb-0.5">{formatDate(item.date)}</p>
                            <h4 className="font-bold text-gray-800 text-sm leading-tight">{item.mealName}</h4>
                          </div>
                        </div>
                        
                        <div className="flex items-center text-sm space-x-3 flex-wrap gap-y-1 bg-emerald-50/50 p-2 rounded-lg">
                          {item.score !== "-" && <div><span className="font-bold text-emerald-600 mr-1">{item.score}点</span></div>}
                          {item.calories > 0 && <div className="text-gray-600 text-xs">{item.calories} kcal</div>}
                          {item.salt > 0 && <div className={`text-xs font-bold ${item.salt >= 2.0 ? 'text-red-500' : 'text-gray-600'}`}>塩分 {item.salt}g</div>}
                          {item.weight && <div className="text-xs font-bold text-blue-600 bg-blue-50 px-2 rounded-md">体重 {item.weight}kg</div>}
                        </div>
                      </div>
                    ))}
                    {historyData.length > visibleCount && (
                      <button onClick={() => setVisibleCount(prev => prev + 10)} className="w-full mt-4 bg-emerald-100 text-emerald-700 font-bold py-3 rounded-xl flex items-center justify-center hover:bg-emerald-200 transition-colors shadow-sm active:scale-95">
                        <ChevronDown className="mr-2" size={20} />さらに10件表示する
                      </button>
                    )}
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      }

      // === メイン画面 ===
      return (
        <div className="min-h-screen text-gray-800 font-sans sm:p-4 bg-emerald-50">
          {renderEditModal()}
          <div className="max-w-md mx-auto bg-white sm:rounded-2xl sm:shadow-xl overflow-hidden min-h-screen sm:min-h-[auto] flex flex-col">
            <header className="bg-emerald-600 text-white p-4 shadow-md z-10 flex items-center justify-between">
              <div className="flex items-center">
                <img src="https://images.unsplash.com/photo-1490818321205-1c702fc526e6?auto=format&fit=crop&w=150&q=80" alt="Icon" className="w-12 h-12 rounded-full border-2 border-emerald-200 object-cover mr-3 shadow-sm" />
                <div><h1 className="text-md font-bold">健康食事アドバイザー</h1><p className="text-[10px] text-emerald-100 mt-1">あなた専用のAI管理栄養士 <span className="opacity-70">v1.2.2</span></p></div>
              </div>
              <button onClick={() => setShowSettings(true)} className="p-2 bg-emerald-700 rounded-full hover:bg-emerald-800"><Settings size={20} /></button>
            </header>

            <main className="flex-grow p-5 flex flex-col space-y-6">
              {!result && !loading && (
                <div className="flex-grow flex flex-col items-center">
                  
                  {/* カレンダー＆体重 */}
                  <div className="w-full bg-blue-50/50 p-4 rounded-xl border border-blue-100 mb-2">
                    <p className="text-sm font-bold text-blue-800 mb-3 flex items-center justify-center"><Calendar className="mr-2" size={18}/>記録する日付 と 今日の体重</p>
                    <div className="flex space-x-3 mb-2">
                      <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="flex-1 bg-white border-2 border-blue-200 rounded-xl px-3 py-2 text-blue-800 font-bold focus:outline-none focus:border-blue-500 shadow-sm" />
                      <div className="flex-1 relative">
                        <input type="number" step="0.1" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="体重" className="w-full bg-white border-2 border-blue-200 rounded-xl px-3 py-2 text-blue-800 font-bold focus:outline-none focus:border-blue-500 shadow-sm pr-8" />
                        <span className="absolute right-3 top-2.5 text-blue-400 font-bold text-sm pointer-events-none">kg</span>
                      </div>
                    </div>
                    <button onClick={handleRecordWeightOnly} className="w-full mt-2 bg-blue-500 text-white font-bold py-2 rounded-xl flex items-center justify-center hover:bg-blue-600 transition-colors shadow-sm active:scale-95 text-sm">
                      <ScaleIcon className="mr-2" size={18} />体重だけを記録する
                    </button>
                  </div>

                  {/* タイミング選択 */}
                  <div className="mb-4 w-full text-center">
                    <div className="flex justify-center space-x-2">
                      {['朝ご飯', '昼ご飯', '夜ご飯', '間食'].map(type => (
                        <button key={type} onClick={() => setMealType(type)} className={`px-4 py-2 rounded-full text-sm font-bold transition-colors ${mealType === type ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-emerald-600 border border-emerald-300 hover:bg-emerald-50'}`}>{type}</button>
                      ))}
                    </div>
                  </div>

                  {/* ★ カメラ / アルバム：透明入力の全面重ねを廃止し、スマホ標準のlabel連動方式へ */}
                  <input
                    id="meal-camera-input"
                    ref={cameraInputRef}
                    type="file"
                    accept="image/*"
                    capture="environment"
                    aria-label="カメラで食事を撮影"
                    className="native-file-input"
                    onChange={handleImageUpload}
                  />
                  <input
                    id="meal-gallery-input"
                    ref={galleryInputRef}
                    type="file"
                    accept="image/*"
                    aria-label="アルバムから食事画像を選ぶ"
                    className="native-file-input"
                    onChange={handleImageUpload}
                  />

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                    <label
                      htmlFor="meal-camera-input"
                      className="border-2 border-emerald-500 rounded-2xl p-4 flex flex-col items-center justify-center bg-white hover:bg-emerald-50 shadow-sm active:scale-95 min-h-[112px] cursor-pointer"
                    >
                      <div className="pointer-events-none w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mb-2 text-emerald-600"><Camera size={24} /></div>
                      <span className="pointer-events-none font-bold text-emerald-700 text-sm">カメラで撮影</span>
                    </label>

                    <label
                      htmlFor="meal-gallery-input"
                      className="border-2 border-emerald-500 rounded-2xl p-4 flex flex-col items-center justify-center bg-white hover:bg-emerald-50 shadow-sm active:scale-95 min-h-[112px] cursor-pointer"
                    >
                      <div className="pointer-events-none w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mb-2 text-emerald-600"><ImageIcon size={24} /></div>
                      <span className="pointer-events-none font-bold text-emerald-700 text-sm">アルバムから選ぶ</span>
                    </label>
                  </div>

                  <div className="w-full mt-3 bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800 leading-relaxed">
                    🔒 食事画像はGoogle Driveへ保存せず、端末内で縮小してAI解析にだけ使用します。ストレージ容量が満杯でも画像解析できます。<br/>
                    ⚠️ 同じ日付に同じ画像や同じ入力内容を再登録すると、保存前に確認が表示されます。
                  </div>

                  {/* ★ 手動テキスト入力ボタン */}
                  <div className="w-full mt-3">
                    <button onClick={() => setShowTextInput(!showTextInput)} className={`w-full border-2 ${showTextInput ? 'border-orange-400 bg-orange-50 text-orange-700' : 'border-emerald-300 bg-white text-emerald-600'} font-bold py-3 rounded-xl flex items-center justify-center transition-colors shadow-sm active:scale-95`}>
                      <FileText className="mr-2" size={20} />{showTextInput ? 'テキスト入力を閉じる' : '📝 写真なしでテキスト入力する'}
                    </button>
                  </div>
                  
                  {/* ★ テキスト入力エリア */}
                  {showTextInput && (
                    <div className="w-full mt-3 p-4 bg-orange-50 border border-orange-200 rounded-xl animate-fade-in shadow-inner">
                      <p className="text-xs font-bold text-orange-800 mb-2">食事の内容を入力（AIが自動でカロリー等を推測します）</p>
                      <textarea 
                        value={textInputData} 
                        onChange={(e) => setTextInputData(e.target.value)} 
                        placeholder="例：ご飯お茶碗1杯、鮭の塩焼き、ほうれん草のお浸し（醤油なし）" 
                        className="w-full border border-orange-300 rounded-lg p-3 text-sm h-24 focus:outline-none focus:border-orange-500 mb-3"
                      />
                      <button onClick={handleTextSubmit} className="w-full bg-orange-500 text-white font-bold py-3 rounded-xl hover:bg-orange-600 shadow-sm active:scale-95 flex justify-center items-center">
                        <Activity className="mr-2" size={18}/> AIに解析・記録してもらう
                      </button>
                      <p className="text-[10px] text-gray-500 mt-2 text-center">※記録した後に、カロリー等を自分で編集することもできます</p>
                    </div>
                  )}

                  <div className="w-full mt-4">
                    <button onClick={handleSkipMeal} className="w-full bg-white border-2 border-gray-300 text-gray-500 font-bold py-3 rounded-xl flex items-center justify-center hover:bg-gray-100 transition-colors shadow-sm active:scale-95">
                      <Coffee className="mr-2" size={20} />この食事は摂らなかった（記録のみ）
                    </button>
                  </div>

                  <div className="w-full mt-8">
                    <button onClick={loadHistory} className="w-full bg-emerald-50 border-2 border-emerald-200 text-emerald-700 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-emerald-100 transition-colors shadow-sm active:scale-95">
                      <HistoryIcon className="mr-2" size={20} />過去の記録を見る
                    </button>
                  </div>

                  <div className="mt-8 bg-emerald-50 rounded-xl p-4 w-full shadow-sm border border-emerald-200">
                    <div className="flex justify-between items-center mb-2">
                      <h3 className="flex items-center text-emerald-800 font-bold"><Info size={18} className="mr-1"/> あなたの登録情報</h3>
                      <button onClick={() => setShowSettings(true)} className="text-xs bg-emerald-200 text-emerald-800 px-2 py-1 rounded hover:bg-emerald-300 font-bold">編集</button>
                    </div>
                    <ul className="text-sm text-emerald-900 space-y-1 ml-1">
                      <li>• {age}歳 {gender} ({nickname} さん)</li>
                      <li>• 身長: {height ? `${height} cm` : "未設定"} / 体重: {weight ? `${weight} kg` : "未記録"}</li>
                      <li className="break-words">• 気をつけていること: {medicalConditions}</li>
                    </ul>
                  </div>
                </div>
              )}

              {loading && (
                <div className="flex-grow flex flex-col items-center justify-center py-12">
                  <div className="relative w-24 h-24 mb-4"><div className="absolute inset-0 border-4 border-emerald-100 rounded-full"></div><div className="absolute inset-0 border-4 border-emerald-500 rounded-full border-t-transparent animate-spin"></div><div className="absolute inset-0 m-auto text-emerald-500 flex items-center justify-center"><Utensils size={32} /></div></div>
                  <p className="text-lg font-bold text-emerald-700 animate-pulse">AIが画像を解析中...</p><p className="text-xs text-gray-500 mt-2">画像は保存せず、その場で解析しています</p>
                </div>
              )}

              {error && (<div className="bg-red-50 text-red-700 p-4 rounded-xl flex items-start shadow-sm border border-red-200"><AlertCircle className="mr-2 flex-shrink-0 mt-0.5" /><p className="text-sm whitespace-pre-wrap">{error}</p></div>)}

              {/* ★ 解析結果画面 */}
              {result && !loading && (
                <div className="animate-fade-in space-y-5">
                  <div className="bg-emerald-100 text-emerald-800 text-sm font-bold p-3 rounded-lg flex items-center justify-between border border-emerald-200">
                    <div className="flex items-center"><CheckCircle className="mr-2" size={18} />自動記録されました</div>
                    {/* ★ 記録直後の編集ボタン */}
                    <button onClick={() => setEditingItem(result)} className="bg-white text-emerald-700 border border-emerald-300 px-3 py-1 rounded-md text-xs hover:bg-emerald-50 shadow-sm flex items-center active:scale-95"><Edit size={14} className="mr-1"/>内容を修正</button>
                  </div>
                  
                  {imagePreview ? (
                    <div className="relative h-40 w-full rounded-xl overflow-hidden shadow-md">
                      <img src={imagePreview} alt="Meal" className="w-full h-full object-cover" />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-3"><h2 className="text-white font-bold text-lg flex items-center"><Utensils size={18} className="mr-2"/>{result.mealName}</h2></div>
                    </div>
                  ) : (
                    <div className="relative h-20 w-full bg-emerald-100 rounded-xl overflow-hidden shadow-md flex items-center justify-center">
                      <h2 className="text-emerald-800 font-bold text-lg flex items-center">
                        {result.mealName === "体重の記録" ? <ScaleIcon size={24} className="mr-2 text-blue-500"/> : <FileText size={24} className="mr-2 text-orange-500"/>}
                        {result.mealName}
                      </h2>
                    </div>
                  )}
                  
                  {result.mealName !== "体重の記録" && (
                    <div className={`rounded-xl p-5 border shadow-sm ${result.totalSaltTargetDate >= 6.0 ? 'bg-red-50 border-red-300' : 'bg-white border-emerald-100'}`}>
                      <h3 className={`text-md font-bold mb-3 flex items-center ${result.totalSaltTargetDate >= 6.0 ? 'text-red-700' : 'text-emerald-800'}`}>
                        {result.totalSaltTargetDate >= 6.0 ? <AlertCircle className="mr-2" size={20}/> : <Activity className="mr-2" size={20}/>}
                        対象日の塩分摂取量
                      </h3>
                      <div className="mb-2 flex justify-between text-sm">
                        <span className={`font-bold ${result.totalSaltTargetDate >= 6.0 ? 'text-red-700 text-lg' : 'text-gray-700'}`}>合計: {result.totalSaltTargetDate.toFixed(1)} g</span>
                        <span className="text-gray-500 self-end">目標: 6.0g未満</span>
                      </div>
                      <div className="w-full bg-gray-200 rounded-full h-3 mb-3 overflow-hidden">
                        <div className={`h-3 rounded-full transition-all duration-1000 ${result.totalSaltTargetDate >= 6.0 ? 'bg-red-500' : result.totalSaltTargetDate >= 4.0 ? 'bg-yellow-400' : 'bg-emerald-500'}`} style={{ width: `${Math.min((result.totalSaltTargetDate / 6.0) * 100, 100)}%` }}></div>
                      </div>
                      {result.totalSaltTargetDate >= 6.0 && (
                        <div className="mt-3 p-3 bg-white/70 border border-red-200 rounded-lg">
                          <p className="text-sm text-red-600 font-bold leading-relaxed flex items-start"><span className="mr-1">⚠️</span> <span>1日の塩分目安をオーバーしています！次の食事や明日は塩分を控えめにしましょう。</span></p>
                        </div>
                      )}
                    </div>
                  )}

                  {result.mealName !== "体重の記録" && (
                    <div className="grid grid-cols-3 gap-3">
                      <div className="bg-white rounded-xl shadow-sm border border-emerald-100 p-3 flex flex-col items-center justify-center"><span className="text-gray-500 text-xs font-medium mb-1">健康スコア</span><div className="flex items-baseline"><span className={`text-2xl font-extrabold ${result.score === '-' ? 'text-gray-400' : result.score >= 80 ? 'text-emerald-500' : result.score >= 60 ? 'text-yellow-500' : 'text-red-500'}`}>{result.score}</span>{result.score !== '-' && <span className="text-gray-500 ml-1 text-xs font-bold">点</span>}</div></div>
                      <div className="bg-white rounded-xl shadow-sm border border-emerald-100 p-3 flex flex-col items-center justify-center"><span className="text-gray-500 text-xs font-medium mb-1">推定カロリー</span><div className="flex items-baseline"><span className="text-2xl font-extrabold text-gray-800">{result.calories}</span><span className="text-gray-500 ml-1 text-xs font-bold">kcal</span></div></div>
                      <div className="bg-white rounded-xl shadow-sm border border-emerald-100 p-3 flex flex-col items-center justify-center"><span className="text-gray-500 text-xs font-medium mb-1">今回の塩分</span><div className="flex items-baseline"><span className={`text-2xl font-extrabold ${result.salt >= 2.5 ? 'text-red-600' : 'text-gray-800'}`}>{result.salt}</span><span className="text-gray-500 ml-1 text-xs font-bold">g</span></div></div>
                    </div>
                  )}

                  {result.score !== '-' && (
                    <div className="bg-white rounded-xl shadow-sm border border-emerald-100 p-5"><h3 className="text-md font-bold text-gray-700 mb-4 flex items-center border-b pb-2"><Activity className="mr-2 text-emerald-500" size={20}/>栄養バランス (PFC)</h3><PFCDonutChart protein={result.protein} fat={result.fat} carbs={result.carbs} /></div>
                  )}
                  
                  {result.missingNutrients && result.missingNutrients.length > 0 && (
                    <div className="bg-orange-50 rounded-xl p-5 border border-orange-100 shadow-sm"><h3 className="text-md font-bold text-orange-800 mb-3 flex items-center"><AlertCircle className="mr-2" size={20}/>補いたい栄養素</h3><ul className="space-y-2">{result.missingNutrients.map((nut, idx) => (<li key={idx} className="flex items-start text-orange-900 bg-white/60 p-2 rounded-lg text-sm font-medium"><CheckCircle className="mr-2 text-orange-500 flex-shrink-0 mt-0.5" size={16} />{nut}</li>))}</ul></div>
                  )}

                  <div className="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-xl p-5 border border-emerald-200 shadow-sm relative overflow-hidden"><h3 className="text-md font-bold text-emerald-800 mb-3 flex items-center relative z-10"><Heart className="mr-2 text-emerald-600" size={20}/>{nickname}さんへ</h3><p className="text-gray-800 leading-relaxed text-[15px] whitespace-pre-wrap relative z-10 font-medium">{result.advice}</p></div>
                  
                  <button onClick={resetApp} className="w-full mt-4 bg-white border-2 border-emerald-500 text-emerald-600 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-emerald-50 active:scale-95"><RefreshCw className="mr-2" size={20} />トップに戻る</button>
                  <button onClick={loadHistory} className="w-full mt-2 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-emerald-100 active:scale-95"><HistoryIcon className="mr-2" size={20} />過去の記録を見る</button>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
